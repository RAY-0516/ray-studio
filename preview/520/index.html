<style>
#enter-veil{position:fixed;inset:0;z-index:99999;background:rgba(6,5,10,0.55);backdrop-filter:blur(28px) brightness(0.75);-webkit-backdrop-filter:blur(28px) brightness(0.75);transition:opacity 1.15s ease,backdrop-filter 1.15s ease,-webkit-backdrop-filter 1.15s ease;pointer-events:none}
#enter-veil.clear{opacity:0;backdrop-filter:blur(0) brightness(1);-webkit-backdrop-filter:blur(0) brightness(1)}
</style>

<body class="locked">
<script src="main.js?v=20261117c"></script>
<div id="enter-veil"></div>
<script>
(function(){
  var v=document.getElementById('enter-veil');
  function clear(){ v.classList.add('clear'); setTimeout(function(){ if(v&&v.parentNode) v.parentNode.removeChild(v); },1400); }
  if(document.readyState==='complete'){ setTimeout(clear,200); }
  else { window.addEventListener('load', function(){ setTimeout(clear,200); }); }
  setTimeout(clear, 2600);
})();
</script>
